<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auria Books - Relatórios</title>
<style>
*{box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif}
body{margin:0;background:#f7f7f7}
header{background:#e30613;color:#fff;padding:16px 32px;display:flex;gap:28px;font-size:1.2rem;font-weight:bold;flex-wrap:wrap}
header a{color:#fff;text-decoration:none}header a.on{text-decoration:underline}
.wrap{padding:24px 32px}
.fbtn{border:2px solid #777;background:#fff;border-radius:14px;padding:10px 28px;font-size:1rem;cursor:pointer;margin:12px 0}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid #e0e0e0;padding:12px;text-align:left}
th{background:#eee}
tbody tr{cursor:pointer}tbody tr:hover{background:#fafafa}
.dev{color:green;font-weight:bold}.atr{color:red;font-weight:bold}.ren{color:#1976d2;font-weight:bold}.emp{color:#999;font-weight:bold}.inte{color:#8e24aa;font-weight:bold}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;border-radius:20px;max-width:560px;width:100%;padding:32px}
.modal .x{float:right;font-size:1.6rem;cursor:pointer;border:0;background:none}
</style>
</head>
<body>
<header><span>Auria Books</span><a href="dashboard.html">Dashboard</a><a href="gerenciamento-acervo.html">Acervo</a><a href="gerenciamento-usuarios.html">Usuários</a><a class="on" href="relatorios.html">Relatórios</a><a href="perfil.html">Ver perfil</a></header>
<div class="wrap">
<h1>Relatórios de empréstimos e devolução</h1><hr>
<button class="fbtn" onclick="alert('Filtro: Todos / Devolvido / Atrasado / Renovado / Emprestado / Interesse')">Filtro ▽</button>
<table>
<tr><th>Data/Hora</th><th>Livro</th><th>Nome</th><th>Status</th></tr>
<tbody id="tb"></tbody>
</table>
</div>

<div class="overlay" id="ov"><div class="modal">
<button class="x" onclick="fechar()">✕</button>
<h2>Detalhes do empréstimo</h2>
<p><b>Data/Hora:</b> <span id="dDt"></span><br>
<b>Livro:</b> <span id="dLv"></span><br>
<b>Aluno:</b> <span id="dNo"></span><br>
<b>Status:</b> <span id="dSt"></span></p>
</div></div>

<script>
var rows=[
['2026-07-21 12:49:23','Diario de Um Banana','Aluno Exemplo','Devolvido','dev'],
['2026-08-20 10:02:51','Diario de Um Banana','Aluno Exemplo','Atrasado','atr'],
['2026-08-06 10:02:51','Diario de Um Banana','Aluno Exemplo','Renovado','ren'],
['2026-07-23 09:32:47','Diario de Um Banana','Aluno Exemplo','Emprestado','emp'],
['2026-07-23 08:15:36','Diario de Um Banana','Aluno Exemplo','Interesse','inte']];
var tb=document.getElementById('tb');
rows.forEach(function(r,i){
var tr=document.createElement('tr');
tr.innerHTML='<td><b>'+r[0]+'</b></td><td><b>'+r[1]+'</b></td><td><b>'+r[2]+'</b></td><td class="'+r[4]+'">• '+r[3]+'</td>';
tr.onclick=function(){dDt.textContent=r[0];dLv.textContent=r[1];dNo.textContent=r[2];dSt.textContent=r[3];
document.getElementById('ov').style.display='flex';};
tb.appendChild(tr);});
function fechar(){document.getElementById('ov').style.display='none';}
</script>
</body>
</html>
